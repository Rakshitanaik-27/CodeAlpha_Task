<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iris Classifier</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
    <h2>Iris Flower Classifier</h2>
    <form id="predict-form">
        <label>Sepal Length (cm):</label>
        <input type="number" step="0.01" name="SepalLengthCm" required>

        <label>Sepal Width (cm):</label>
        <input type="number" step="0.01" name="SepalWidthCm" required>

        <label>Petal Length (cm):</label>
        <input type="number" step="0.01" name="PetalLengthCm" required>

        <label>Petal Width (cm):</label>
        <input type="number" step="0.01" name="PetalWidthCm" required>

        <button type="submit">Predict</button>
    </form>
    <h3 id="result"></h3>
</div>
<script>
document.getElementById('predict-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const response = await fetch('/predict', {
        method: 'POST',
        body: formData
    });
    const result = await response.json();
    if(result.prediction)
        document.getElementById('result').innerText = "Predicted Species: " + result.prediction;
    else
        document.getElementById('result').innerText = "Error: " + result.error;
});
</script>
</body>
</html>
